<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host Controller</title>
    <style>
      /* The host controller is a tool, not a show. It is styled for a phone in
         a dark room: high contrast, large targets, undo permanently reachable.
         It deliberately does NOT follow the show theme — the host must be able
         to read it whatever the preset does to the projector. */
      :root {
        --bg: #0d1117;
        --surface: #171d27;
        --surface-raised: #212936;
        --line: #2c3543;
        --text: #eef2f8;
        --muted: #93a0b4;
        --accent: #ffc53d;
        --correct: #3ddc84;
        --wrong: #ff5c5c;
        --touch: 48px;
        --radius: 10px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 12px 12px 96px;
      }

      h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
      h2 {
        font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.12em;
        color: var(--muted); margin: 20px 0 8px;
      }

      .topbar {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
      }
      .phase {
        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
        color: var(--accent); border: 1px solid var(--line);
        padding: 4px 10px; border-radius: 999px; white-space: nowrap;
      }

      button {
        min-height: var(--touch);
        padding: 10px 14px;
        font: inherit;
        font-weight: 600;
        color: var(--text);
        background: var(--surface-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: 0.32; cursor: not-allowed; }
      button.primary { background: var(--accent); color: #12161d; border-color: var(--accent); }
      button.correct { background: var(--correct); color: #0b1a10; border-color: var(--correct); }
      button.wrong { background: var(--wrong); color: #1a0b0b; border-color: var(--wrong); }

      .row { display: flex; flex-wrap: wrap; gap: 8px; }

      .board { display: grid; gap: 6px; }
      .board-column { display: grid; gap: 6px; }
      .board-column .head {
        font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted); text-align: center; padding: 4px 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .board button { min-height: 56px; display: grid; gap: 2px; padding: 6px; }
      .board button .value { font-size: 1.05rem; color: var(--accent); }
      .board button .prompt {
        font-size: 0.66rem; font-weight: 400; color: var(--muted); line-height: 1.2;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }

      .card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 12px;
      }
      .card .label {
        font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
      }
      .card .prompt { font-size: 1.05rem; margin: 4px 0 10px; }
      .card .answer { font-size: 1.15rem; font-weight: 700; color: var(--correct); }
      .card .note { font-size: 0.85rem; color: var(--muted); margin-top: 6px; font-style: italic; }

      .scores { display: grid; gap: 6px; }
      .score-row {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 8px 12px; background: var(--surface); border: 1px solid var(--line);
        border-left: 4px solid var(--team, var(--accent)); border-radius: var(--radius);
      }
      .score-row .value { font-variant-numeric: tabular-nums; font-weight: 700; }

      .undo-dock {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: flex; gap: 8px; padding: 10px 12px;
        background: linear-gradient(to top, var(--bg) 70%, transparent);
      }
      .undo-dock button { flex: 1; }

      .banner {
        padding: 10px 12px; border-radius: var(--radius); margin-top: 10px;
        background: rgba(255, 92, 92, 0.12); border: 1px solid var(--wrong); color: var(--wrong);
        font-size: 0.85rem;
      }
      .banner[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="root">Connecting…</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
